<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WelliVerify — Healthcare Trust & Verification Platform</title>
  <meta name="description" content="WelliVerify is a pharmaceutical supply-chain trust and verification platform for the Nigerian market (NAFDAC-grounded) spanning Pharmacist, Patient, Distributor, Regulator, and Laboratory roles.">

  <!-- Typography: Source Serif 4 (Broadsheet Design System) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

  <!-- Broadsheet Design System Core Tokens & Components -->
  <link rel="stylesheet" href="_ds_broadsheet/styles.css">

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="shell">
    <!-- Showcase Toolbar -->
    <header class="prototype-toolbar" role="region" aria-label="Prototype Controls">
      <div class="toolbar-brand">
        <div class="logo-badge">W</div>
        <span>WelliVerify</span>
        <span class="tag tag-accent" style="font-size:10px;padding:2px 6px">Prototype</span>
      </div>

      <nav class="toolbar-roles" aria-label="Role Switcher">
        <button type="button" class="role-chip" data-role="pharmacist">Pharmacist</button>
        <button type="button" class="role-chip" data-role="patient">Patient</button>
        <button type="button" class="role-chip" data-role="distributor">Distributor</button>
        <button type="button" class="role-chip" data-role="regulator">Regulator</button>
        <button type="button" class="role-chip" data-role="lab">Laboratory</button>
      </nav>

      <div class="toolbar-actions">
        <div id="api-status-badge" class="api-status-badge online" title="WelliVerify Sovereign Trust API Mesh (Port 4000)">
          <span class="status-dot"></span>
          <span class="status-label" id="api-status-text">API Online</span>
        </div>
        <button type="button" class="tool-btn" id="toggle-frame-btn" title="Toggle iPhone Bezel or Fullscreen">
          <svg width="13" height="13" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.2" d="M192,40H64A16,16,0,0,0,48,56V200a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V56A16,16,0,0,0,192,40Z"/><path d="M192,32H64A24,24,0,0,0,40,56V200a24,24,0,0,0,24,24H192a24,24,0,0,0,24-24V56A24,24,0,0,0,192,32Zm8,168a8,8,0,0,1-8,8H64a8,8,0,0,1-8-8V56a8,8,0,0,1,8-8H192a8,8,0,0,1,8,8Z"/></svg>
          <span id="frame-label">Frame</span>
        </button>
        <button type="button" class="tool-btn" id="reset-btn" title="Reset Prototype State">
          <svg width="13" height="13" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.2" d="M224,128a96,96,0,0,1-96,96A95.88,95.88,0,0,1,60.16,196.16l-3.32-3.32L32,217.69V144H105.69L84.85,164.85l3.32,3.31A79.88,79.88,0,0,0,128,208a80,80,0,1,0-80-80,8,8,0,0,1-16,0,96,96,0,1,1,192,0Z"/><path d="M224,128a96,96,0,0,1-96,96A95.88,95.88,0,0,1,60.16,196.16l-3.32-3.32L32,217.69V144a8,8,0,0,1,8-8h73.69L84.85,164.85l3.32,3.31A79.88,79.88,0,0,0,128,208a80,80,0,1,0-80-80,8,8,0,0,1-16,0,96,96,0,1,1,192,0Zm-112,0a16,16,0,1,0-16,16A16,16,0,0,0,112,128Z"/></svg>
          <span>Reset</span>
        </button>
      </div>
    </header>

    <!-- Mobile Device Preview Container -->
    <main class="device-container" id="device-container">
      <!-- Dynamic Island / Top Camera -->
      <div class="device-notch">
        <div class="notch-camera"></div>
      </div>

      <!-- Realistic iOS Status Bar -->
      <div class="status-bar" aria-hidden="true">
        <div class="status-time" id="status-clock">09:41</div>
        <div class="status-icons">
          <!-- Cellular Signal -->
          <svg width="15" height="13" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.3" d="M192,64h32v152H192ZM136,104h32v112H136ZM80,144h32v72H80ZM24,184h32v32H24Z"/><path d="M224,56H192a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8h32a8,8,0,0,0,8-8V64A8,8,0,0,0,224,56Zm-8,152H200V72h16Zm-48-112H136a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8h32a8,8,0,0,0,8-8V104A8,8,0,0,0,168,96Zm-8,112H144V112h16Zm-48,40H80a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8h32a8,8,0,0,0,8-8V144A8,8,0,0,0,112,136Zm-8,72H88V152h16Zm-48,40H24a8,8,0,0,0-8,8v32a8,8,0,0,0,8,8H56a8,8,0,0,0,8-8V184A8,8,0,0,0,56,176Zm-8,32H32V192H48Z"/></svg>
          <!-- Wifi -->
          <svg width="15" height="13" viewBox="0 0 256 256" fill="currentColor"><path opacity="0.3" d="M128,64a135.5,135.5,0,0,1,96.17,39.83l-17,17A111.48,111.48,0,0,0,128,88a111.48,111.48,0,0,0-79.2,32.83l-17-17A135.5,135.5,0,0,1,128,64Z"/><path d="M128,56A143.51,143.51,0,0,0,26.24,98.24a8,8,0,0,0,11.32,11.32A127.5,127.5,0,0,1,128,72a127.5,127.5,0,0,1,90.44,37.56,8,8,0,0,0,11.32-11.32A143.51,143.51,0,0,0,128,56Zm67.88,67.88a8,8,0,0,0-11.32,0,79.52,79.52,0,0,0-113.12,0,8,8,0,1,0,11.32,11.32,63.5,63.5,0,0,1,90.48,0A8,8,0,0,0,195.88,123.88Zm-33.94,33.94a8,8,0,0,0-11.32,0,31.79,31.79,0,0,0-45.24,0,8,8,0,0,0,11.31,11.32,15.79,15.79,0,0,1,22.62,0A8,8,0,0,0,161.94,157.82Zm-22.63,33.94a16,16,0,1,0-22.62,0,15.86,15.86,0,0,0,22.62,0Z"/></svg>
          <!-- Battery -->
          <svg width="20" height="13" viewBox="0 0 256 256" fill="currentColor"><rect x="32" y="72" width="168" height="112" rx="16" fill="none" stroke="currentColor" stroke-width="16"/><rect x="44" y="84" width="124" height="88" rx="8" fill="currentColor"/><path d="M224,104v48" stroke="currentColor" stroke-width="16" stroke-linecap="round"/></svg>
        </div>
      </div>

      <!-- App Canvas Root Mount -->
      <div id="app" class="app-screen-wrap"></div>

      <!-- Home Indicator -->
      <div class="home-indicator" aria-hidden="true"></div>

      <!-- Notification Toast -->
      <div id="toast" class="toast-notice" role="alert" aria-live="assertive">
        <span id="toast-text">Action completed</span>
      </div>
    </main>
  </div>

  <!-- WelliVerify API Client & Interoperability Gateway SDK -->
  <script src="api-client.js"></script>

  <!-- WelliVerify Interactive Prototype Runtime -->
  <script src="app.js"></script>
</body>
</html>
